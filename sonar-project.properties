sonar.organization=williamjs95
sonar.projectKey=williamjs95_alder-banking-dashboard
sonar.projectName=alder-banking-dashboard

sonar.sources=src
sonar.tests=src,test,e2e
sonar.test.inclusions=src/**/*.test.ts,src/**/*.test.tsx,test/**,e2e/**
sonar.exclusions=src/**/*.test.ts,src/**/*.test.tsx,src/components/ui/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
# The same files `yarn test:coverage` leaves out: thin framework shells that the
# end-to-end suite covers instead.
sonar.coverage.exclusions=src/app/**/page.tsx,src/app/**/layout.tsx,src/app/**/loading.tsx,src/app/**/error.tsx,src/app/**/not-found.tsx,src/app/robots.ts,src/proxy.ts,src/server/session.ts,src/lib/utils.ts
